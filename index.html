<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #fff;
      --ink: #16161a;
      --ink2: #45454d;
      --muted: #8b8b93;
      --line: #e7e5e0;
      --soft: #f2f1ee;
      --accent: #ff4f7b;
      --accent-soft: #ffe6ed;
      --star: #f5a524;
      --ok: #16a34a;
      --bad: #dc2626;
      --r: 16px;
      --sh1: 0 1px 2px rgba(20, 20, 30, .04), 0 2px 8px rgba(20, 20, 30, .04);
      --sh2: 0 4px 10px rgba(20, 20, 30, .05), 0 14px 34px rgba(20, 20, 30, .08);
      --ease: cubic-bezier(.2, .8, .2, 1)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      width: 100%;
      -webkit-text-size-adjust: 100%
    }

    body {
      font-family: Inter, "IBM Plex Sans Thai", system-ui, sans-serif;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .4s
    }

    body.bg-mist {
      background: linear-gradient(160deg, #eef2f8 0%, #f6f5f2 55%, #f3eff7 100%) fixed
    }

    body.bg-paper {
      background: #f6f5f2 radial-gradient(rgba(0, 0, 0, .06) 1px, transparent 1px) 0 0/20px 20px fixed
    }

    body.bg-blush {
      background: linear-gradient(160deg, #fff1ee 0%, #f8f4fb 60%, #eef3fb 100%) fixed
    }

    body.bg-sage {
      background: linear-gradient(160deg, #eef5ef 0%, #f6f5ef 60%, #eef4f6 100%) fixed
    }

    body.bg-dusk {
      background: linear-gradient(160deg, #e9ecf6 0%, #f1ecf6 50%, #fbefe9 100%) fixed
    }

    a {
      color: inherit
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent
    }

    svg.ico {
      width: 18px;
      height: 18px;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle
    }

    svg.ico.fillme {
      fill: currentColor
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px
    }

    .hidden {
      display: none !important
    }

    /* header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: saturate(1.4) blur(16px);
      -webkit-backdrop-filter: saturate(1.4) blur(16px);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
      padding-top: env(safe-area-inset-top)
    }

    .hrow {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 10px 0;
      flex-wrap: wrap
    }

    .bicon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(140deg, #ff7a9c, #ff4f7b 55%, #ff9f6b);
      box-shadow: 0 6px 16px rgba(255, 79, 123, .25)
    }

    .bicon svg {
      width: 20px;
      height: 20px
    }

    .htitle {
      flex: 1;
      min-width: 200px
    }

    .ibtn.backbtn {
      flex: none;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink2);
      text-decoration: none;
      box-shadow: var(--sh1)
    }

    .ibtn.backbtn svg {
      width: 20px;
      height: 20px;
      transition: transform .2s var(--ease)
    }

    .ibtn.backbtn:hover {
      background: #fff;
      border-color: #d3d0c8;
      color: var(--ink)
    }

    .ibtn.backbtn:hover svg {
      transform: translateX(-2px)
    }

    .htitle h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.015em;
      line-height: 1.25
    }

    .htitle p {
      margin: 1px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .hmeta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink2);
      white-space: nowrap
    }

    .pill svg {
      width: 15px;
      height: 15px
    }

    .status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, .15)
    }

    .status.off i {
      background: var(--bad);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .12)
    }

    .stars {
      display: inline-flex;
      gap: 2px;
      color: var(--star)
    }

    .stars svg {
      width: 14px;
      height: 14px
    }

    .stars svg.used {
      color: #d9d6cf
    }

    .hact {
      display: flex;
      gap: 2px;
      align-items: center
    }

    .ibtn {
      position: relative;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--ink2);
      transition: background .15s, color .15s, transform .12s
    }

    .ibtn:hover {
      background: rgba(0, 0, 0, .05);
      color: var(--ink)
    }

    .ibtn:active {
      transform: scale(.92)
    }

    .namebtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px 0 10px;
      margin-left: 4px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh1);
      transition: border-color .15s, transform .12s;
      max-width: 200px
    }

    .namebtn svg {
      width: 16px;
      height: 16px;
      flex: none;
      color: var(--ink2)
    }

    .namebtn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .namebtn:hover {
      border-color: #d3d0c8
    }

    .namebtn:active {
      transform: scale(.96)
    }

    .hint a svg {
      width: 14px;
      height: 14px;
      vertical-align: -2px
    }

    .ibtn[data-tip]:hover:after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      animation: fade .15s
    }

    .sortwrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 38px;
      border-radius: 12px;
      color: var(--ink2);
      transition: background .15s
    }

    .sortwrap:hover {
      background: rgba(0, 0, 0, .05)
    }

    .sortwrap svg {
      position: absolute;
      left: 10px;
      pointer-events: none
    }

    .sortwrap select {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: inherit;
      padding: 0 12px 0 34px;
      height: 38px;
      cursor: pointer;
      outline: none
    }

    /* my group bar */
    .bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0;
      padding: 6px 8px 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink2);
      box-shadow: var(--sh1)
    }

    .bar svg {
      width: 15px;
      height: 15px;
      color: var(--accent)
    }

    .bar b {
      color: var(--ink);
      font-weight: 600
    }

    .bar select {
      font: inherit;
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff
    }

    .bar .hint {
      color: var(--muted)
    }

    .notice {
      margin: 0;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .85);
      font-size: 13.5px;
      color: var(--ink2);
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .notice svg {
      color: var(--muted);
      margin-top: 1px
    }

    /* posts */
    main.wrap {
      padding-top: 28px;
      padding-bottom: 130px
    }

    #mybar:not(:empty) {
      padding-top: 24px
    }

    .posts {
      margin: 0 auto
    }

    .layout-wall .posts {
      columns: 290px;
      column-gap: 18px
    }

    .layout-wall .post {
      break-inside: avoid;
      margin-bottom: 18px
    }

    .layout-grid .posts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
      align-items: start
    }

    .layout-stream .posts {
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .post {
      display: block;
      width: 100%;
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--sh1);
      border: 1px solid rgba(0, 0, 0, .04);
      overflow: hidden;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s, background-color .3s var(--ease);
      animation: rise .45s var(--ease) both
    }

    .post:hover {
      transform: translateY(-3px);
      box-shadow: var(--sh2)
    }

    .post.example {
      border: 1.5px dashed #f3b6c6
    }

    .post.example.c-white {
      background: linear-gradient(180deg, #fff7f9, #fff 120px)
    }

    .post.pinned:not(.example) {
      border-color: #e9dcc1
    }

    .chip.ex {
      background: var(--accent-soft);
      color: #c2264f
    }

    .chip.pin {
      background: #fff3d6;
      color: #9a6200
    }

    .p-text.long {
      -webkit-line-clamp: 6
    }

    .post.c-rose {
      background: #ffe9ee
    }

    .post.c-peach {
      background: #ffeedd
    }

    .post.c-lemon {
      background: #fff7d1
    }

    .post.c-mint {
      background: #e2f5e8
    }

    .post.c-sky {
      background: #e1eeff
    }

    .post.c-lavender {
      background: #eee7ff
    }

    .post.c-stone {
      background: #efede8
    }

    .post:not(.c-white)[class*=" c-"] .chip:not(.ex):not(.pin):not(.you) {
      background: rgba(255, 255, 255, .65)
    }

    .post:not(.c-white)[class*=" c-"] .cmt .body {
      background: rgba(255, 255, 255, .7)
    }

    .colors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .cdot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
      display: grid;
      place-items: center;
      transition: transform .15s
    }

    .cdot:hover {
      transform: scale(1.1)
    }

    .cdot svg {
      width: 15px;
      height: 15px;
      opacity: 0;
      color: var(--ink);
      transition: opacity .15s
    }

    .cdot.sel {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), 0 0 0 2px #fff, 0 0 0 4px var(--ink)
    }

    .cdot.sel svg {
      opacity: 1
    }

    .post.picked {
      border-color: rgba(245, 165, 36, .55);
      box-shadow: 0 0 0 2px rgba(245, 165, 36, .35), var(--sh1)
    }

    .p-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 14px 0
    }

    .p-head .who {
      min-width: 0;
      line-height: 1.2
    }

    .p-head .who b {
      display: block;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .p-head .who small {
      font-size: 11.5px;
      color: var(--muted)
    }

    .p-head .sp {
      flex: 1
    }

    .more {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: background .15s, color .15s
    }

    .more:hover {
      background: var(--soft);
      color: var(--ink)
    }

    .p-main {
      padding: 10px 14px 2px;
      cursor: pointer
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink2)
    }

    .chip.you {
      background: var(--accent-soft);
      color: #c2264f
    }

    .chip svg {
      width: 12px;
      height: 12px
    }

    .p-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px
    }

    .p-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -.01em;
      line-height: 1.3;
      word-break: break-word
    }

    .p-text {
      margin: 10px 0 0;
      color: var(--ink2);
      font-size: 13.5px;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .p-mem {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      gap: 6px;
      align-items: flex-start
    }

    .p-mem svg {
      width: 14px;
      height: 14px;
      margin-top: 2px
    }

    .p-foot {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 10px 12px
    }

    .vbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      border-radius: 999px;
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink2);
      cursor: pointer;
      transition: background .15s, color .15s, transform .12s
    }

    .vbtn svg {
      width: 17px;
      height: 17px;
      transition: transform .3s var(--ease)
    }

    .vbtn:hover:not(:disabled) {
      background: #fff6e6;
      color: #b86e00
    }

    .vbtn:active:not(:disabled) {
      transform: scale(.94)
    }

    .vbtn.on {
      background: #fff2d9;
      color: #b86e00
    }

    .vbtn.on svg {
      fill: var(--star);
      stroke: var(--star)
    }

    .vbtn.pop svg {
      animation: pop .45s var(--ease)
    }

    .vbtn:disabled {
      opacity: .38;
      cursor: not-allowed
    }

    .vcount {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px
    }

    .vcount svg {
      width: 16px;
      height: 16px;
      fill: var(--star);
      stroke: var(--star)
    }

    .cbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      border-radius: 999px;
      height: 34px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink2);
      cursor: pointer;
      transition: background .15s
    }

    .cbtn:hover {
      background: var(--soft)
    }

    .cbtn svg {
      width: 16px;
      height: 16px
    }

    /* media */
    .media {
      position: relative;
      margin: 0 14px;
      border-radius: 12px;
      aspect-ratio: 16/9;
      background: #18181c;
      overflow: hidden;
      isolation: isolate
    }

    .media.tall {
      aspect-ratio: 9/16;
      max-height: 520px;
      margin-left: auto;
      margin-right: auto;
      width: calc(100% - 28px)
    }

    .media iframe,
    .media video {
      position: absolute;
      inset: 0;
      width: 1px;
      min-width: 100%;
      height: 100%;
      border: 0;
      animation: fade .3s
    }

    .media .cover {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      cursor: pointer;
      color: #fff;
      background: #18181c center/cover no-repeat;
      transition: transform .5s var(--ease)
    }

    .media:hover .cover {
      transform: scale(1.03)
    }

    .media .cover:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, .5))
    }

    .media .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      display: grid;
      place-items: center;
      z-index: 1;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
      transition: transform .25s var(--ease), background .2s
    }

    .media .play svg {
      width: 20px;
      height: 20px;
      margin-left: 2px
    }

    .media:hover .play {
      transform: translate(-50%, -50%) scale(1.08)
    }

    .media .src {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 1;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      opacity: .95
    }

    .media .src svg {
      width: 13px;
      height: 13px
    }

    .media .ext {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 2;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      gap: 4px;
      align-items: center;
      backdrop-filter: blur(6px)
    }

    .media .ext svg {
      width: 12px;
      height: 12px
    }

    .media.round {
      margin: 0
    }

    .media .cover.k-drive,
    .media .cover.k-slides,
    .media .cover.k-canva {
      background-image: radial-gradient(120% 90% at 20% 10%, #3a4256 0, #1d2029 60%)
    }

    .media .cover .big {
      position: absolute;
      left: 50%;
      top: calc(50% + 44px);
      transform: translateX(-50%);
      z-index: 1;
      font-size: 12px;
      font-weight: 500;
      opacity: .85;
      white-space: nowrap
    }

    .media .cover .ttl {
      position: absolute;
      left: 14px;
      right: 74px;
      top: 12px;
      z-index: 1;
      text-align: left;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      margin: 4px 0
    }

    .tbl-wrap table {
      min-width: 320px
    }

    .media .cover .ttl small {
      display: block;
      font-size: 11px;
      font-weight: 600;
      opacity: .65;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 3px
    }

    .media .cover.has-thumb .ttl {
      display: none
    }

    .media .help {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 2;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 999px;
      backdrop-filter: blur(6px)
    }

    .av.grp {
      border-radius: 10px;
      font-size: 12.5px
    }

    .linkcheck {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      background: rgba(0, 0, 0, .04);
      color: var(--ink2)
    }

    .linkcheck.bad {
      background: #fdecec;
      color: #9b1c1c
    }

    .linkcheck.ok {
      background: #e9f7ef;
      color: #17603a
    }

    .linkcheck ol {
      margin: 4px 0 0;
      padding-left: 18px
    }

    .linkcheck a {
      color: inherit;
      font-weight: 600
    }

    /* skeleton */
    .skel {
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--sh1);
      padding: 14px;
      break-inside: avoid;
      margin-bottom: 18px
    }

    .skel i {
      display: block;
      border-radius: 8px;
      background: linear-gradient(90deg, #efeeea 0%, #f7f6f3 50%, #efeeea 100%) 0 0/200% 100%;
      animation: shimmer 1.2s linear infinite
    }

    .empty {
      max-width: 380px;
      margin: 70px auto;
      text-align: center;
      color: var(--muted);
      animation: rise .4s var(--ease) both
    }

    .empty .big {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: var(--sh1);
      color: var(--accent)
    }

    .empty h3 {
      color: var(--ink);
      font-weight: 650;
      margin: 0 0 6px;
      font-size: 16px
    }

    .fab {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 30;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 26px rgba(255, 79, 123, .4);
      transition: transform .25s var(--ease), box-shadow .25s;
      animation: popin .4s var(--ease) both
    }

    .fab svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.2;
      transition: transform .3s var(--ease)
    }

    .fab:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 14px 30px rgba(255, 79, 123, .45)
    }

    .fab:hover svg {
      transform: rotate(90deg)
    }

    .fab:active {
      transform: scale(.95)
    }

    .fab .lbl {
      position: absolute;
      right: 68px;
      background: var(--ink);
      color: #fff;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(6px);
      transition: .2s;
      pointer-events: none
    }

    .fab:hover .lbl {
      opacity: 1;
      transform: none
    }

    /* overlays */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 75;
      background: rgba(22, 22, 28, .38);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 44px 16px;
      overflow: auto;
      animation: fade .2s
    }

    .modal {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .22);
      animation: modalin .32s var(--ease) both
    }

    .modal.wide {
      max-width: 820px
    }

    .m-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px 22px;
      border-bottom: 1px solid var(--soft)
    }

    .m-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      flex: 1;
      letter-spacing: -.01em
    }

    .m-body {
      padding: 18px 22px
    }

    .m-foot {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 22px 18px
    }

    .x {
      border: 0;
      background: transparent;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: background .15s, color .15s
    }

    .x:hover {
      background: var(--soft);
      color: var(--ink)
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      width: min(410px, 100%);
      background: #fff;
      display: flex;
      flex-direction: column;
      transform: translateX(102%);
      transition: transform .35s var(--ease), box-shadow .35s;
      visibility: hidden
    }

    .drawer.open {
      transform: none;
      visibility: visible;
      box-shadow: -24px 0 60px rgba(0, 0, 0, .12)
    }

    .drawer .m-body {
      overflow: auto;
      flex: 1
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink2);
      margin-bottom: 6px
    }

    .field label span {
      color: var(--muted);
      font-weight: 400
    }

    .field label .req {
      color: var(--bad);
      font-weight: 600
    }

    input[type=text],
    input[type=url],
    input[type=email],
    input[type=password],
    input[type=datetime-local],
    textarea,
    .selectbox {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fbfbfa;
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s, background .15s
    }

    input:focus,
    textarea:focus,
    .selectbox:focus {
      outline: none;
      border-color: #c9c6bf;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, .04)
    }

    textarea {
      min-height: 84px;
      resize: vertical
    }

    .big {
      font-size: 20px !important;
      font-weight: 650;
      border: 0 !important;
      background: transparent !important;
      padding: 2px 0 !important;
      box-shadow: none !important;
      letter-spacing: -.01em
    }

    .preview {
      margin-top: 10px
    }

    .seg {
      display: flex;
      background: var(--soft);
      border-radius: 12px;
      padding: 3px
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      display: inline-flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      transition: background .2s, color .2s, box-shadow .2s
    }

    .seg button svg {
      width: 15px;
      height: 15px
    }

    .seg button.sel {
      background: #fff;
      color: var(--ink);
      box-shadow: var(--sh1)
    }

    .walls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px
    }

    .wall {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06)
    }

    .wall:hover {
      transform: scale(1.05)
    }

    .wall.sel {
      border-color: var(--ink)
    }

    .sw {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--soft)
    }

    .sw b {
      font-size: 13.5px;
      font-weight: 550;
      display: block
    }

    .sw small {
      color: var(--muted);
      font-size: 12.5px
    }

    .switch {
      position: relative;
      width: 40px;
      height: 24px;
      flex: none
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .switch span {
      position: absolute;
      inset: 0;
      background: #dcdad4;
      border-radius: 999px;
      transition: background .25s;
      cursor: pointer
    }

    .switch span:before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .25s var(--ease);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2)
    }

    .switch input:checked+span {
      background: var(--ok)
    }

    .switch input:checked+span:before {
      transform: translateX(16px)
    }

    .sec {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 24px 0 6px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 15px;
      cursor: pointer;
      font-size: 13.5px;
      text-decoration: none;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s
    }

    .btn svg {
      width: 16px;
      height: 16px
    }

    .btn:hover {
      border-color: #d3d0c8;
      background: #fcfcfb
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    .btn.primary:hover {
      background: #000;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .18)
    }

    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.danger {
      color: var(--bad)
    }

    .btn.sm {
      padding: 6px 11px;
      font-size: 12.5px;
      border-radius: 10px
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .hint {
      font-size: 12.5px;
      color: var(--muted)
    }

    .note {
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .04);
      color: var(--ink2);
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      gap: 9px;
      align-items: flex-start
    }

    .note svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
      margin-top: 1px
    }

    .av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 650;
      font-size: 11px;
      letter-spacing: .02em
    }

    .av.sm {
      width: 24px;
      height: 24px;
      font-size: 10px
    }

    .cmts {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .cmt {
      display: flex;
      gap: 10px
    }

    .cmt.pending {
      animation: rise .3s var(--ease) both
    }

    .cmt .body {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      background: var(--soft);
      border-radius: 4px 14px 14px 14px;
      padding: 8px 12px
    }

    .cmt .body b {
      font-weight: 600;
      font-size: 12.5px
    }

    .cmt .body small {
      color: var(--muted);
      margin-left: 6px;
      font-size: 11.5px
    }

    .cmt .body div {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--ink2)
    }

    .cmt.pending {
      opacity: .55
    }

    .cmt .del {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      align-self: center
    }

    .cmt .del:hover {
      background: var(--soft);
      color: var(--bad)
    }

    .cbox {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      align-items: center
    }

    .cbox input {
      flex: 1;
      border-radius: 999px;
      padding-left: 16px
    }

    .cbox .btn {
      border-radius: 999px;
      width: 42px;
      height: 42px;
      padding: 0
    }

    .rank {
      display: flex;
      flex-direction: column
    }

    .rrow {
      display: grid;
      grid-template-columns: 30px 1fr 44px;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--soft);
      animation: rise .35s var(--ease) both
    }

    .rrow .n {
      font-weight: 650;
      color: var(--muted);
      text-align: center;
      font-size: 13px
    }

    .rrow .n.top {
      color: #fff;
      background: var(--star);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      font-size: 12px
    }

    .rrow .t div {
      font-size: 13.5px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .rrow .track {
      height: 6px;
      background: var(--soft);
      border-radius: 3px;
      margin-top: 7px;
      overflow: hidden
    }

    .rrow .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffb84d, var(--accent));
      border-radius: 3px;
      transform-origin: left;
      animation: grow .8s var(--ease) both
    }

    .rrow .c {
      text-align: right;
      font-weight: 650
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    th,
    td {
      text-align: left;
      padding: 8px 4px;
      border-bottom: 1px solid var(--soft);
      vertical-align: top;
      word-break: break-word
    }

    th {
      color: var(--muted);
      font-weight: 500
    }

    .menu {
      position: absolute;
      z-index: 85;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--sh2);
      padding: 5px;
      min-width: 180px;
      max-width: calc(100vw - 20px);
      animation: menuin .18s var(--ease) both;
      transform-origin: top right
    }

    .menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13.5px;
      cursor: pointer;
      transition: background .12s
    }

    .menu button svg {
      width: 16px;
      height: 16px;
      color: var(--muted)
    }

    .menu button:hover {
      background: var(--soft)
    }

    .menu button.danger,
    .menu button.danger svg {
      color: var(--bad)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(14px) scale(.98);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity .25s, transform .3s var(--ease);
      pointer-events: none;
      z-index: 90;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2)
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%)
    }

    .copyrow {
      display: flex;
      gap: 8px
    }

    .copyrow input {
      flex: 1;
      font-size: 12.5px;
      color: var(--ink2)
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink2);
      font-weight: 500
    }

    /* home */
    .home {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 90px;
      animation: rise .4s var(--ease) both
    }

    .home .hh {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px
    }

    .home h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.025em;
      margin: 0
    }

    .home>p {
      color: var(--muted);
      margin: 0 0 28px
    }

    .blist {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .brow {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: var(--r);
      background: #fff;
      box-shadow: var(--sh1);
      border: 1px solid rgba(0, 0, 0, .04);
      transition: transform .2s var(--ease), box-shadow .2s;
      animation: rise .4s var(--ease) both
    }

    .brow:hover {
      transform: translateY(-2px);
      box-shadow: var(--sh2)
    }

    .brow .bi {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      font-weight: 700;
      color: #fff
    }

    .brow .info {
      flex: 1;
      min-width: 0
    }

    .brow .info a {
      font-weight: 650;
      font-size: 15px;
      text-decoration: none
    }

    .brow .meta {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .newb {
      display: flex;
      gap: 8px;
      margin-top: 14px
    }

    .newb input {
      flex: 1
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes modalin {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.98)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes menuin {
      from {
        opacity: 0;
        transform: scale(.95)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes popin {
      from {
        opacity: 0;
        transform: scale(.6)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.45) rotate(-12deg)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes grow {
      from {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    /* ---------- video post modal (YouTube-style fullscreen) ---------- */
    .ov-post-view {
      padding: 0;
      align-items: center;
      justify-content: center;
      background: rgba(12, 12, 16, .75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.post-view {
      max-width: 880px;
      width: 100%;
      max-height: 94vh;
      max-height: 94dvh;
      height: 94vh;
      height: 94dvh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
      animation: modalin .3s var(--ease) both;
    }

    .pv-topnav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--soft);
      background: #fff;
      flex: none;
      z-index: 10;
    }

    .pv-topnav .pv-toptitle {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14.5px;
    }

    .pv-topnav .pv-toptitle b {
      font-weight: 650;
      color: var(--ink);
    }

    .pv-player-wrap {
      flex: none;
      width: 100%;
      max-width: 100%;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* แยก selector fullscreen เป็นคนละกฎ (ถ้ารวมกัน เบราว์เซอร์ที่ไม่รู้จักตัวใดตัวหนึ่งจะทิ้งทั้งกฎ) */
    .pv-player-wrap:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      background: #000 !important;
    }

    .pv-player-wrap:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      background: #000 !important;
    }

    .pv-player-wrap .media {
      margin: 0 auto;
      border-radius: 0;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      padding: 0;
      background: #000;
      box-shadow: none;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* วิดีโอแนวตั้ง: กำหนดความสูงจริง แล้วให้ความกว้างคำนวณจากสัดส่วน */
    .pv-player-wrap .media.tall {
      aspect-ratio: 9 / 16;
      height: 70vh;
      height: 70dvh;
      width: auto;
      max-width: 100%;
    }

    .pv-player-wrap:fullscreen .media {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: auto;
    }

    .pv-player-wrap:-webkit-full-screen .media {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: auto;
    }

      $('fab').classList.add('hidden');
      document.title = 'Group Video Showcase'; document.body.className = 'bg-mist';
      var list = H.boards.slice().sort(function (a, b) { return (b.mine ? 1 : 0) - (a.mine ? 1 : 0); });
      var rows = list.map(function (b) {
        var link = boardLink(b.id, H.url);
        var meta = [b.groups + (b.groups === 1 ? ' group' : ' groups'), b.votingOpen ? 'Voting open' : 'Voting closed'];
        if (H.isAdmin) meta.splice(1, 0, (b.classSize ? b.voters + ' of ' + b.classSize : b.voters) + ' voted');
        return h('div', { class: 'brow' },
          h('div', { class: 'bi', style: 'background:hsl(' + hue(b.id) + ' 70% 66%)' }, (b.name.match(/\d+/) || [initials(b.name)])[0]),
          h('div', { class: 'info' }, h('a', { href: link, onclick: goBoardHandler(b.id) }, b.name), h('div', { class: 'meta' }, meta.join(' · '), b.mine ? h('span', { class: 'tag' }, 'Your board') : null)),
          H.isAdmin ? h('button', { class: 'ibtn', 'data-tip': 'Share link', onclick: function () { openLinkModal(b.name, link); } }, ico('share')) : null,
          H.isAdmin ? h('button', { class: 'ibtn', onclick: function (e) { e.stopPropagation(); boardMenu(e.currentTarget, b); } }, ico('more')) : null,
          h('a', { class: 'btn sm primary', href: link, onclick: goBoardHandler(b.id), style: 'text-decoration:none' }, 'Open'));
      });
      var nameIn = h('input', { type: 'text', maxlength: 80, placeholder: 'New board name, e.g. Section 2' });
      fill(app, h('div', { class: 'home' },
        h('div', { class: 'hh' }, h('h1', null, 'Group Video Showcase')),
        h('p', null, H.isAdmin ? 'Create one board per section and send each section its own link.' : 'Choose your section’s board.'),
        rows.length ? h('div', { class: 'blist' }, rows) : h('div', { class: 'empty' }, 'No boards yet.'),
        H.isAdmin ? h('form', {
          class: 'newb', onsubmit: function (e) {
            e.preventDefault(); var v = nameIn.value.trim(); if (!v) return;
            call('createBoard', v).then(function (r) { HOME = r; renderHome(); toast('Board created'); }).catch(function (err) { toast(err.message); });
          }
        }, nameIn, h('button', { class: 'btn primary', type: 'submit' }, 'Create board')) : null,
        H.isAdmin ? h('div', { id: 'adminSec' }) : null,
        h('p', { class: 'hint', style: 'margin-top:40px;text-align:center' }, 'Admin mode on this device · ', h('a', { href: '#', onclick: function (e) { e.preventDefault(); adminLogout(); } }, 'Leave admin mode'))));
      if (H.isAdmin) { if (ADMINS) renderAdmins(); else call('getAdmins').then(function (r) { ADMINS = r; renderAdmins(); }).catch(function () { }); }
    }
    var ADMINS = null;
    function renderAdmins() {
      var el = $('adminSec'); if (!el || !ADMINS) return;
      var pc = h('input', { type: 'password', maxlength: 100, minlength: 8, placeholder: 'New passcode (8+ characters)', autocomplete: 'new-password' });
      pc.style.cssText = 'flex:1;font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line)';
      fill(el,
        h('h2', { style: 'font-size:16px;font-weight:600;margin:44px 0 4px' }, 'Admin devices'),
        h('p', { class: 'hint', style: 'margin:0 0 14px' }, 'Anyone who enters the admin passcode becomes an admin on that browser. Admins create boards, change settings, see results and who voted, and remove posts. They don\'t vote.'),
        h('div', { class: 'blist' }, ADMINS.admins.map(function (a) {
          return h('div', { class: 'brow', style: 'padding:12px 18px' },
            h('div', { class: 'info' }, h('div', { style: 'font-weight:500' }, str(a.name, 40), a.isMe ? h('span', { class: 'hint' }, '  (this device)') : null),
              h('div', { class: 'meta' }, a.addedAt ? 'since ' + ago(a.addedAt) : '')),
            a.isMe ? null : h('button', { class: 'btn sm danger', onclick: function () { confirmBox('Remove ' + str(a.name, 40) + '?', 'That device loses admin access right away.', function () { call('removeAdmin', a.uid).then(function (r) { ADMINS = r; renderAdmins(); toast('Admin removed'); }).catch(function (e) { toast(e.message); }); }); } }, 'Remove'));
        })),
        h('h2', { style: 'font-size:16px;font-weight:600;margin:32px 0 4px' }, 'Admin passcode'),
        h('p', { class: 'hint', style: 'margin:0 0 10px' }, 'Changing it doesn\'t sign out existing admins — remove their devices above if needed.'),
        h('form', {
          class: 'newb', onsubmit: function (e) {
            e.preventDefault(); var v = pc.value; if (v.length < 8) { toast('Use at least 8 characters'); return; }
            call('setPasscode', v).then(function () { pc.value = ''; toast('Passcode changed'); }).catch(function (err) { toast(err.message); });
          }
        },
          pc, h('button', { class: 'btn primary', type: 'submit' }, 'Change')));
    }
    function boardMenu(anchor, b) {
      closeMenu();
      var r = anchor.getBoundingClientRect();
      var m = h('div', { class: 'menu', id: 'menu', style: 'top:' + (r.bottom + window.scrollY + 4) + 'px;left:' + Math.max(8, r.right + window.scrollX - 180) + 'px' },
        h('button', {
          onclick: function () {
            closeMenu(); var inp = h('input', { type: 'text', maxlength: 80, value: b.name });
            openModal([mHead('Rename board'), h('div', { class: 'm-body' }, inp), h('div', { class: 'm-foot' }, h('button', { class: 'btn', onclick: closeModal }, 'Cancel'), h('button', { class: 'btn primary', onclick: function () { call('renameBoard', b.id, inp.value).then(function (r) { closeModal(); HOME = r; renderHome(); }).catch(function (e) { toast(e.message); }); } }, 'Save'))]); setTimeout(function () { inp.focus(); }, 30);
          }
        }, ico('edit'), 'Rename'),
        h('button', { class: 'danger', onclick: function () { closeMenu(); confirmBox('Delete “' + b.name + '”?', 'All posts, votes and comments on this board will be permanently deleted.', function () { call('deleteBoard', b.id).then(function (r) { HOME = r; renderHome(); toast('Board deleted'); }).catch(function (e) { toast(e.message); }); }); } }, ico('trash'), 'Delete'));
      document.body.append(m);
      setTimeout(function () { document.addEventListener('click', closeMenu, { once: true }); }, 0);
    }

    /* =================== boot =================== */
    function fatal(e) {
      fill($('app'), h('div', { class: 'empty', style: 'margin-top:120px;max-width:440px' }, h('div', { class: 'big' }, ico('info')), h('h3', null, 'Couldn’t load'), h('p', { style: 'margin:0' }, (e && e.message) || 'Try refreshing the page.'),
        h('div', { style: 'margin-top:16px;display:flex;gap:8px;justify-content:center' },
          h('a', { href: '?', class: 'btn sm', onclick: function (ev) { if (window.MOCK_NAV) { ev.preventDefault(); window.MOCK_NAV(null); } } }, 'Home'),
          h('button', { class: 'btn sm', onclick: function () { location.reload(); } }, 'Retry'))));
    }
    var live = null, liveTimer = null;
    function listen(board) {
      if (live) { try { sb.removeChannel(live); } catch (e) { } live = null; }
      if (!sb || !board) return;
      // board_ticks changes whenever anything on this board changes → reload quietly
      live = sb.channel('board-' + board).on('postgres_changes', { event: '*', schema: 'public', table: 'board_ticks', filter: 'board=eq.' + board }, function () {
        clearTimeout(liveTimer); liveTimer = setTimeout(poll, 250);
      }).subscribe();
    }
    function start(boardId) {
      BOARD = boardId || null; S = null; HOME = null; ADMINS = null; closeModal(); closeDrawer();
      if (BOARD) { buildShell(); call('getState', BOARD).then(setState).catch(fatal); listen(BOARD); }
      else { listen(null); call('getBoards').then(function (r) { HOME = r; renderHome(); }).catch(fatal); }
    }
    function toggleFs(el) {
      if (!el) el = document.querySelector('.pv-player-wrap');
      if (!el) return;
      var doc = document;
      var isFs = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
      if (isFs) {
        var cfs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
        if (cfs) cfs.call(doc);
      } else {
        var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (rfs) {
          try { var p = rfs.call(el); if (p && p.catch) p.catch(function () { }); } catch (e) { }
        } else {
          var vid = el.querySelector('video');
          if (vid && vid.webkitEnterFullscreen) { try { vid.webkitEnterFullscreen(); } catch (e) { } }
        }
      }
    }
    function boardFromUrl() { try { return new URLSearchParams(location.search).get('board'); } catch (e) { return null; } }
    $('fab').onclick = function () { if (S && S.isAdmin) openAdminAddChooser(); else openComposer(); };
    function openAdminAddChooser() {
      openModal([mHead('Add a card'), h('div', { class: 'm-body' },
        h('button', { class: 'btn primary', style: 'width:100%;margin-bottom:10px', onclick: function () { closeModal(); openComposer(); } }, ico('film'), 'Post a group’s video (counts in voting)'),
        h('button', { class: 'btn', style: 'width:100%', onclick: function () { closeModal(); openExampleComposer(); } }, ico('bulb'), 'Example card (not part of voting)'))]);
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeMenu(); if ($('modalRoot').children.length) closeModal(); else closeDrawer(); } });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
    setInterval(poll, POLL_MS);
    setInterval(function () { if (S && BOARD) { renderBoard(); } }, 30000);
    (function boot() {
      if (window.MOCK_BACKEND) { start(boardFromUrl() || window.MOCK_START_BOARD || null); return; }
      if (!window.supabase || !CFG.supabaseUrl || /YOUR_/.test(CFG.supabaseUrl + CFG.supabaseAnonKey)) {
        fill($('app'), h('div', { class: 'empty', style: 'margin-top:110px;max-width:460px' }, h('div', { class: 'big' }, ico('info')),
          h('h3', null, 'Almost there — connect Supabase'),
          h('p', { style: 'margin:0' }, 'Open config.js and fill in your Supabase project URL and anon key (see the setup guide).')));
        return;
      }
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, detectSessionInUrl: true } });
      // guest mode: every browser gets an anonymous session automatically (kept in localStorage)
      sb.auth.getSession().then(function (r) {
        if (r.data && r.data.session) return r.data.session;
        return sb.auth.signInAnonymously().then(function (x) { if (x.error) throw x.error; return x.data.session; });
      }).then(function () { start(boardFromUrl()); })
        .catch(function (e) {
          fatal(new Error(/anonymous/i.test((e && e.message) || '') ? 'Guest access is turned off. In Supabase → Authentication → Sign In / Providers, enable “Allow anonymous sign-ins”.'
            : /rate|too many/i.test((e && e.message) || '') ? 'Too many people joined from this network at once — please wait a minute and refresh.' : (e && e.message) || 'Couldn’t start a guest session'));
        });
    })();
  </script>
</body>

</html>
